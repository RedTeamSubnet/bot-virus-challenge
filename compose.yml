services:
  challenge-api:
    image: redteamsubnet61/rest-bv-challenge:1.0.4
    container_name: bot_virus_v1
    build:
      context: ./src/bv_challenge/challenge
    platform: linux/amd64
    restart: unless-stopped
    networks:
      - bot-virus-challenge-net
    environment:
      TERM: ${TERM:-xterm}
      TZ: ${TZ:-Asia/Seoul}
      BV_CHALLENGE_API_PORT: ${BV_CHALLENGE_API_PORT:-10001}
      BV_CHALLENGE_VM_ENDPOINT: ${BV_CHALLENGE_VM_ENDPOINT:-http://bot-runner:8000}
      BV_CHALLENGE_BOT_TIMEOUT: ${BV_CHALLENGE_BOT_TIMEOUT:-120}
    env_file:
      - path: .env
        required: false
    volumes:
      - "./volumes/configs/rest-bv-challenge:${BV_CHALLENGE_API_CONFIGS_DIR:-/etc/rest-bv-challenge}"
      - "./volumes/storage/rest-bv-challenge/logs:${BV_CHALLENGE_API_LOGS_DIR:-/var/log/rest-bv-challenge}"
      - "./volumes/storage/rest-bv-challenge/data:${BV_CHALLENGE_API_DATA_DIR:-/var/lib/rest-bv-challenge}"
    ports:
      - "${BV_CHALLENGE_API_PORT:-10001}:${BV_CHALLENGE_API_PORT:-10001}"
  bot-runner:
    image: redteamsubnet61/bv-bot-runner:latest
    platform: linux/amd64
    build:
      context: ./src/modules/bv-bot-runner
    restart: unless-stopped
    networks:
      - bot-virus-challenge-net
      - bot-virus-internal-net
    environment:
      TERM: ${TERM:-xterm}
      TZ: ${TZ:-UTC}
      VM_RUNNER_API_PORT: ${VM_RUNNER_API_PORT:-8000}
      DOCKER_HOST: unix:///docker-socket/docker.sock
      MDM_CHALLENGE_COMMIT_DIR: /commit
    env_file:
      - path: .env
        required: false
    volumes:
      - "./volumes/storage/rest-mdm-sn-container-runner/logs:${VM_RUNNER_API_LOGS_DIR:-/var/log/rest.bv-vm-runner}"
      - "./volumes/storage/rest-mdm-sn-container-runner/data:${VM_RUNNER_API_DATA_DIR:-/var/lib/rest.bv-vm-runner}"
      - "bot-runner-dind-socket:/docker-socket"
      - "./src/bv_challenge/challenge/commit:/commit"
    ports:
      - "${VM_RUNNER_API_PORT:-8000}:${VM_RUNNER_API_PORT:-8000}"
  bot-runner-dind:
    image: redteamsubnet61/bot_virus_bot_runner_dind:latest
    build:
      context: ./src/modules/bv-bot-runner
      dockerfile: Dockerfile.dind
    restart: unless-stopped
    networks:
      - bot-virus-challenge-net
      - bot-virus-internal-net
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    volumes:
      - "bot-runner-dind-socket:/docker-socket"
      - "bot-runner-dind-data:/var/lib/docker"
      - "./src/bv_challenge/challenge/commit:/commit:ro"
  scorer:
    image: redteamsubnet61/rest-rt-score:4.3.7-260909
    platform: linux/amd64
    build:
      context: ./src/modules/rt-score
    restart: unless-stopped
    networks:
      - bot-virus-challenge-net
      - bot-virus-internal-net
    environment:
      TERM: ${TERM:-xterm}
      TZ: ${TZ:-UTC}
      RTS_API_PORT: ${RTS_API_PORT:-8000}
      CHALLENGE_API_URL: ${CHALLENGE_API_URL:-http://challenge-api:10001}
      CHALLENGE_API_KEY: ${BV_CHALLENGE_API_KEY}
    env_file:
      - path: .env
        required: false
    volumes:
      - "./volumes/configs/rest-rt-score:${RTS_API_CONFIGS_DIR:-/etc/rest-rt-score}"
      - "./volumes/storage/rest-rt-score/logs:${RTS_API_LOGS_DIR:-/var/log/rest-rt-score}"
      - "./volumes/storage/rest-rt-score/data:${RTS_API_DATA_DIR:-/var/lib/rest-rt-score}"
    expose:
      - "${RTS_API_PORT:-8000}"
    tty: true
  web-page:
    image: redteamsubnet61/web-rt-login-page:0.1.0-261110
    build:
      context: ./src/modules/web-page
    restart: unless-stopped
    networks:
      - bot-virus-internal-net
    environment:
      TZ: ${TZ:-UTC}
    env_file:
      - path: .env
        required: false
    ports:
      - "${WEB_PAGE_PORT:-3000}:80"
    depends_on:
      - scorer
networks:
  bot-virus-challenge-net:
    name: bot-virus-challenge-net
    driver: bridge
  bot-virus-internal-net:
    name: bot-virus-internal-net
    driver: bridge
    internal: true
volumes:
  bot-runner-dind-socket:
  bot-runner-dind-data:
