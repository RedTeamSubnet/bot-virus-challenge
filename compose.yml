services:
  challenge-api:
    image: redteamsubnet61/rest-bv-challenge:0.0.0
    build:
      context: ./src/bv_challenge/challenge
    restart: unless-stopped
    networks:
      - bot-virus-challenge-net
      - bot-executor-net
    privileged: true
    ulimits:
      nofile: 32768
    environment:
      TERM: ${TERM:-xterm}
      TZ: ${TZ:-Asia/Seoul}
      BV_CHALLENGE_API_PORT: ${BV_CHALLENGE_API_PORT:-10001}
      BV_CHALLENGE_API_BOT_RUNNER_URL: ${BV_CHALLENGE_API_BOT_RUNNER_URL:-http://bot-runner:8000}
      BV_CHALLENGE_API_BOT_RUNNER_SESSION_COUNT: ${BV_CHALLENGE_API_BOT_RUNNER_SESSION_COUNT:-2}
      BV_CHALLENGE_API_BOT_RUNNER_REQUEST_TIMEOUT_SEC: ${BV_CHALLENGE_API_BOT_RUNNER_REQUEST_TIMEOUT_SEC:-900}
    env_file:
      - path: .env
        required: false
    volumes:
      - "./volumes/configs/rest-bv-challenge:${BV_CHALLENGE_API_CONFIGS_DIR:-/etc/rest-bv-challenge}"
      - "./volumes/storage/rest-bv-challenge/logs:${BV_CHALLENGE_API_LOGS_DIR:-/var/log/rest-bv-challenge}"
      - "./volumes/storage/rest-bv-challenge/data:${BV_CHALLENGE_API_DATA_DIR:-/var/lib/rest-bv-challenge}"
    ports:
      - "${BV_CHALLENGE_API_PORT:-10001}:${BV_CHALLENGE_API_PORT:-10001}"
    tty: true

  bot-runner:
    image: redteamsubnet61/bot_virus_bot_runner:latest
    build:
      context: ./src/modules/rest.mdm-sn-container-runner
    restart: unless-stopped
    networks:
      - bot-virus-challenge-net
    user: "0:0"
    environment:
      TERM: ${TERM:-xterm}
      TZ: ${TZ:-UTC}
      VM_RUNNER_API_PORT: ${VM_RUNNER_API_PORT:-8000}
      DOCKER_HOST: unix:///docker-socket/docker.sock
      CHALLENGE_PROXY_PORT: ${CHALLENGE_PROXY_PORT:-10001}
      SIMPLE_BOT_FRONTEND_PROXY_PORT: ${SIMPLE_BOT_FRONTEND_PROXY_PORT:-5173}
      SIMPLE_BOT_BACKEND_PROXY_PORT: ${SIMPLE_BOT_BACKEND_PROXY_PORT:-4000}
    env_file:
      - path: .env
        required: false
    volumes:
      - "bot-runner-logs:${VM_RUNNER_API_LOGS_DIR:-/var/log/rest.vm-runner}"
      - "bot-runner-data:${VM_RUNNER_API_DATA_DIR:-/var/lib/rest.vm-runner}"
      - "bot-runner-dind-socket:/docker-socket"
    ports:
      - "${VM_RUNNER_API_PORT:-8000}:${VM_RUNNER_API_PORT:-8000}"
    tty: true

  bot-runner-dind:
    image: redteamsubnet61/bot_virus_bot_runner_dind:latest
    build:
      context: ./src/modules/rest.mdm-sn-container-runner
      dockerfile: Dockerfile.dind
    restart: unless-stopped
    networks:
      - bot-virus-challenge-net
      - bot-executor-net
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
      CHALLENGE_PROXY_PORT: ${CHALLENGE_PROXY_PORT:-10001}
      CHALLENGE_PROXY_TARGET_HOST: ${CHALLENGE_PROXY_TARGET_HOST:-challenge-api}
      CHALLENGE_PROXY_TARGET_PORT: ${CHALLENGE_PROXY_TARGET_PORT:-10001}
      SIMPLE_BOT_FRONTEND_PROXY_PORT: ${SIMPLE_BOT_FRONTEND_PROXY_PORT:-5173}
      SIMPLE_BOT_FRONTEND_PROXY_TARGET_HOST: ${SIMPLE_BOT_FRONTEND_PROXY_TARGET_HOST:-simple-bot-frontend}
      SIMPLE_BOT_FRONTEND_PROXY_TARGET_PORT: ${SIMPLE_BOT_FRONTEND_PROXY_TARGET_PORT:-80}
      SIMPLE_BOT_BACKEND_PROXY_PORT: ${SIMPLE_BOT_BACKEND_PROXY_PORT:-4000}
      SIMPLE_BOT_BACKEND_PROXY_TARGET_HOST: ${SIMPLE_BOT_BACKEND_PROXY_TARGET_HOST:-simple-bot-backend}
      SIMPLE_BOT_BACKEND_PROXY_TARGET_PORT: ${SIMPLE_BOT_BACKEND_PROXY_TARGET_PORT:-4000}
    volumes:
      - "bot-runner-dind-socket:/docker-socket"
      - "bot-runner-dind-data:/var/lib/docker"
    tty: true

  simple-bot-backend:
    image: redteamsubnet61/simple-bot-backend:latest
    build:
      context: ./src/modules/iw-bot-detection/backend
    restart: unless-stopped
    networks:
      - bot-virus-challenge-net
      - bot-executor-net
    environment:
      PORT: ${SIMPLE_BOT_BACKEND_PORT:-4000}
      FRONTEND_ORIGIN: ${SIMPLE_BOT_FRONTEND_ORIGIN:-http://localhost:5173}
      GOOGLE_APPLICATION_CREDENTIALS: ${SIMPLE_BOT_GOOGLE_APPLICATION_CREDENTIALS:-/app/key/service-account.json}
      BQ_PROJECT_ID: ${SIMPLE_BOT_BQ_PROJECT_ID:-innerworks-qa}
      BQ_DATASET: ${SIMPLE_BOT_BQ_DATASET:-qa_innerworks_userdata}
      BQ_TABLE: ${SIMPLE_BOT_BQ_TABLE:-dev_inference_result}
    env_file:
      - path: .env
        required: false
    volumes:
      - "./volumes/configs/simple-bot-backend/key:/app/key:ro"
    ports:
      - "${SIMPLE_BOT_BACKEND_PUBLIC_PORT:-4000}:${SIMPLE_BOT_BACKEND_PORT:-4000}"
    tty: true

  simple-bot-frontend:
    image: redteamsubnet61/simple-bot-frontend:latest
    build:
      context: ./src/modules/iw-bot-detection/frontend
      args:
        VITE_BACKEND_URL: ${SIMPLE_BOT_BROWSER_BACKEND_URL:-http://localhost:4000}
    restart: unless-stopped
    networks:
      - bot-virus-challenge-net
      - bot-executor-net
    ports:
      - "${SIMPLE_BOT_FRONTEND_PUBLIC_PORT:-5173}:80"
    tty: true

networks:
  bot-virus-challenge-net:
    name: bot-virus-challenge-net
    driver: bridge
  bot-executor-net:
    name: bot-executor-net
    driver: bridge
    internal: true

volumes:
  bot-runner-logs:
  bot-runner-data:
  bot-runner-dind-socket:
  bot-runner-dind-data:
