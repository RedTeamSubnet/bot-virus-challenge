services:
  challenge-api:
    image: redteamsubnet61/rest-bv-challenge:1.0.4
    container_name: bot_virus_v1
    build:
      context: ./src/bv_challenge/challenge
    platform: linux/amd64
    restart: unless-stopped
    environment:
      TERM: ${TERM:-xterm}
      TZ: ${TZ:-Asia/Seoul}
      BV_CHALLENGE_API_PORT: ${BV_CHALLENGE_API_PORT:-10001}
      BV_CHALLENGE_VM_ENDPOINT: ${BV_CHALLENGE_VM_ENDPOINT:-http://bot-runner-vm:8000}
      BV_CHALLENGE_API_KEY: ${BV_CHALLENGE_API_KEY:-dev-challenge-key-change-me}
      BV_CHALLENGE_VM_API_KEY: ${BV_CHALLENGE_VM_API_KEY:-dev-runner-key-change-me}
      BV_CHALLENGE_BOT_TIMEOUT: ${BV_CHALLENGE_BOT_TIMEOUT:-120}
      BV_CHALLENGE_SCORER_ENDPOINT: ${BV_CHALLENGE_SCORER_ENDPOINT:-}
      BV_CHALLENGE_RUNS_COMPARE_MODE: ${BV_CHALLENGE_RUNS_COMPARE_MODE:-shadow}
    env_file:
      - path: .env
        required: false
    volumes:
      - "./volumes/configs/rest-bv-challenge:${BV_CHALLENGE_API_CONFIGS_DIR:-/etc/rest-bv-challenge}"
      - "./volumes/storage/rest-bv-challenge/logs:${BV_CHALLENGE_API_LOGS_DIR:-/var/log/rest-bv-challenge}"
      - "./volumes/storage/rest-bv-challenge/data:${BV_CHALLENGE_API_DATA_DIR:-/var/lib/rest-bv-challenge}"
    ports:
      - "${BV_CHALLENGE_API_PORT:-10001}:${BV_CHALLENGE_API_PORT:-10001}"
