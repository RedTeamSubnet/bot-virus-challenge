services:
  challenge-api:
    image: redteamsubnet61/rest-bv-challenge:0.0.0
    build:
      context: ./src/bv_challenge/challenge
    restart: unless-stopped
    networks:
      - bot-virus-challenge-net
      - bot-executor-net
    privileged: true
    ulimits:
      nofile: 32768
    environment:
      TERM: ${TERM:-xterm}
      TZ: ${TZ:-Asia/Seoul}
      BV_CHALLENGE_API_PORT: ${BV_CHALLENGE_API_PORT:-10001}
      BV_CHALLENGE_API_BOT_RUNNER_URL: ${BV_CHALLENGE_API_BOT_RUNNER_URL:-http://bot-runner:8000}
      BV_CHALLENGE_API_BOT_RUNNER_SESSION_COUNT: ${BV_CHALLENGE_API_BOT_RUNNER_SESSION_COUNT:-2}
      BV_CHALLENGE_API_BOT_RUNNER_REQUEST_TIMEOUT_SEC: ${BV_CHALLENGE_API_BOT_RUNNER_REQUEST_TIMEOUT_SEC:-900}
    env_file:
      - path: .env
        required: false
    volumes:
      - "./volumes/configs/rest-bv-challenge:${BV_CHALLENGE_API_CONFIGS_DIR:-/etc/rest-bv-challenge}"
      - "./volumes/storage/rest-bv-challenge/logs:${BV_CHALLENGE_API_LOGS_DIR:-/var/log/rest-bv-challenge}"
      - "./volumes/storage/rest-bv-challenge/data:${BV_CHALLENGE_API_DATA_DIR:-/var/lib/rest-bv-challenge}"
    ports:
      - "${BV_CHALLENGE_API_PORT:-10001}:${BV_CHALLENGE_API_PORT:-10001}"
    tty: true

  bot-runner:
    image: redteamsubnet61/bot_virus_bot_runner:latest
    build:
      context: ./src/modules/rest.mdm-sn-container-runner
    restart: unless-stopped
    networks:
      - bot-virus-challenge-net
    user: "0:0"
    environment:
      TERM: ${TERM:-xterm}
      TZ: ${TZ:-UTC}
      VM_RUNNER_API_PORT: ${VM_RUNNER_API_PORT:-8000}
      DOCKER_HOST: unix:///docker-socket/docker.sock
      CHALLENGE_PROXY_PORT: ${CHALLENGE_PROXY_PORT:-10001}
    env_file:
      - path: .env
        required: false
    volumes:
      - "bot-runner-logs:${VM_RUNNER_API_LOGS_DIR:-/var/log/rest.vm-runner}"
      - "bot-runner-data:${VM_RUNNER_API_DATA_DIR:-/var/lib/rest.vm-runner}"
      - "bot-runner-dind-socket:/docker-socket"
    ports:
      - "${VM_RUNNER_API_PORT:-8000}:${VM_RUNNER_API_PORT:-8000}"
    tty: true

  bot-runner-dind:
    image: redteamsubnet61/bot_virus_bot_runner_dind:latest
    build:
      context: ./src/modules/rest.mdm-sn-container-runner
      dockerfile: Dockerfile.dind
    restart: unless-stopped
    networks:
      - bot-virus-challenge-net
      - bot-executor-net
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
      CHALLENGE_PROXY_PORT: ${CHALLENGE_PROXY_PORT:-10001}
      CHALLENGE_PROXY_TARGET_HOST: ${CHALLENGE_PROXY_TARGET_HOST:-challenge-api}
      CHALLENGE_PROXY_TARGET_PORT: ${CHALLENGE_PROXY_TARGET_PORT:-10001}
    volumes:
      - "bot-runner-dind-socket:/docker-socket"
      - "bot-runner-dind-data:/var/lib/docker"
    tty: true

networks:
  bot-virus-challenge-net:
    name: bot-virus-challenge-net
    driver: bridge
  bot-executor-net:
    name: bot-executor-net
    driver: bridge
    internal: true

volumes:
  bot-runner-logs:
  bot-runner-data:
  bot-runner-dind-socket:
  bot-runner-dind-data:
