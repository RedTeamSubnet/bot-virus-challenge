<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Browser verification</title>
    <script>
      // Injected by the challenge backend (see service.get_web).
      // The page only loads the SDK, collects browser/runtime integrity signals,
      // and submits the encrypted payload to /_eval. No scoring logic lives here.
      window.PUBLIC_KEY = `{{ public_key }}`;

      // Minimal, machine-readable config for the SDK. Plain values only, with
      // no scoring logic or hints of any kind.
      window.TASK_CONFIG = {
        evalUrl: "/_eval",
        payloadKey: "data",
        autoSubmit: true
      };

      // Session binding fields (non-secret). The SDK echoes these into the
      // payload's sessionBinding section; the private detector decides what they
      // mean. PUBLIC_KEY above is the per-session encryption key material.
      window.BV_SESSION = {
        sessionId: `{{ session_id }}`,
        nonce: `{{ nonce }}`,
        publicKeyId: `{{ public_key_id }}`,
        configHash: `{{ config_hash }}`,
        schemaVersion: `{{ schema_version }}`
      };
    </script>
    <style>
      :root {
        --bg: #0f1115;
        --surface: #1a1d24;
        --text: #e7e9ee;
        --muted: #9aa0ad;
        --accent: #4f7cff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      main {
        max-width: 420px;
        margin: 0 auto;
        padding: 96px 20px 0;
        text-align: center;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 12px;
      }
      p {
        color: var(--muted);
        margin: 0 0 24px;
      }
      #status {
        display: inline-block;
        padding: 8px 14px;
        border-radius: 8px;
        background: var(--surface);
        color: var(--accent);
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Browser verification</h1>
      <p>Checking browser environment...</p>
      <div id="status">Checking…</div>
    </main>

    <!-- collector.js must load before sdk.js; both are classic scripts. -->
    <script src="/static/js/collector.js" defer></script>
    <script src="/static/js/sdk.js" defer></script>
  </body>
</html>
