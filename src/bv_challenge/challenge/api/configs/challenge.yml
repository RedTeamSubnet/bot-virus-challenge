challenge:
  n_run_per_ch: 10
  bot_timeout: 200
  # Layer 1/2 fallback score policy
  gate_fail_score: 0.0
  metrics_processor_error_score: 0.5
  session_timeout_score: 0.0
  runner_fail_score: 0.0
  # Bot container lifecycle, run by this service against the DinD sidecar.
  commit_dir: "/commit"
  miner_image_tag: "redteamsubnet/bv-miner:latest"
  challenge_network_name: "bot-challenge-network"
  container_run_timeout_sec: 10
  container_wait_timeout_sec: 900
