challenge:
  n_ch_per_epoch: 1
  n_run_per_ch: 10
  allowed_pip_pkg_dt: "2025-01-01T00:00:00Z"
  allowed_file_exts: [".py", ".json", ".yaml", ".yml", ".txt", ".pt"]
  bot_timeout: 200
  # Layer 1/2 fallback score policy
  gate_fail_score: 0.0
  metrics_processor_error_score: 0.5
  session_timeout_score: 0.0
  runner_fail_score: 0.0
  # VM configuration for remote Docker build/run
  vm_endpoint: "http://bot-runner:8000"
  vm_timeout: 200
  vm_ssl_verify: false
